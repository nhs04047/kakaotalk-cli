name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # openssl-src(vendored)를 Windows에서 빌드하려면 NASM이 필요.
      # (Strawberry Perl / MSVC는 windows-latest 러너에 사전 설치됨)
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

# 참고: DEK 프로세스 메모리 스캔 · AX/Win32 UI 자동화 · 실제 DB 복호화는
# KakaoTalk 실행 환경이 필요하므로 CI(헤드리스 러너)에서는 검증할 수 없다.
# CI는 크로스플랫폼 컴파일 + 순수 로직 단위테스트까지만 보장한다.
