[package]
name = "kakaocli-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kakaocli-core = { path = "../kakaocli-core" }
kakaocli-db = { path = "../kakaocli-db" }
kakaocli-auth = { path = "../kakaocli-auth" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# === macOS dependencies ===
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
accessibility = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"

# === Windows dependencies ===
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
]}

# === Linux/other: compile but panic at runtime ===
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
# No platform-specific deps needed; code uses compile_error-free stub